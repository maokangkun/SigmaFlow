/* css/tokens.css */
/* Design tokens: flat surfaces; no background gradients or glossy effects. */
:root {
  --bg: #f3f4f6;
  --sidebar: #eef0f3;
  --surface: #f7f8fa;
  --surface-hover: #f9fafb;
  --inset: #eef0f4;
  --line: #e1e4eb;
  --line-soft: #e9ebf0;
  --ink: #292d3c;
  --ink-strong: #1e2231;
  --muted: #747b8d;
  --faint: #9298a8;
  --accent: #7775b6;
  --accent-dark: #625f9e;
  --accent-bg: #eae9f3;
  --green: #548678;
  --green-bg: #e7eeeb;
  --amber: #977951;
  --amber-bg: #f2ede5;
  --red: #ac6674;
  --red-bg: #f2e7ea;
  --blue: #6e8db1;
  --shadow: 5px 5px 15px #dfe2e980, -5px -5px 15px #ffffffc9;
  --shadow-small: 3px 3px 7px #dce0e982, -3px -3px 7px #ffffffd9;
  --shadow-inset: inset 2px 2px 5px #dce0e98a, inset -2px -2px 5px #ffffffeb;
  --radius: 16px;
  --radius-sm: 10px;
  --sidebar-width: 226px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;

  /* Unified minimal-neumorphic scrollbar */
  --scrollbar-size: 10px;
  --scrollbar-size-thin: 8px;
  --scrollbar-track: #eef1f5;
  --scrollbar-thumb: #bcc3ce;
  --scrollbar-thumb-hover: #aab3c0;
  --scrollbar-thumb-active: #98a2b1;
  --scrollbar-border: #f5f7fa;
}
:root[data-contrast="high"] {
  --muted: #535d71;
  --faint: #636d80;
  --line: #c4cad6;
  --accent: #65609e;
  --shadow: 0 0 0 1px var(--line);
  --shadow-small: 0 0 0 1px var(--line);
}

</style>

/* 对话区滚动条: 无箭头按钮, 静止时隐藏, 滚动时浮现 */
/* Firefox (标准属性) */
.conversation{scrollbar-width:thin;scrollbar-color:transparent transparent}
.conversation.is-scrolling{scrollbar-color:var(--line) transparent}
/* WebKit (Chrome/Edge/Safari) */
.conversation::-webkit-scrollbar{width:9px;background:transparent}
.conversation::-webkit-scrollbar-button{display:none;height:0;width:0}
.conversation::-webkit-scrollbar-thumb{background:transparent;border-radius:5px}
.conversation.is-scrolling::-webkit-scrollbar-thumb{background:var(--line)}
.conversation::-webkit-scrollbar-track{background:transparent}

@media(max-width:800px){.chat-page{height:calc(100dvh - 54px)}}
@media(min-width:801px){.chat-composer{margin-top:12px}}
/* 生成中: agent 头像脉动动画 */
.avatar-pulsing{animation:avatar-pulse 1.4s ease-in-out infinite}
@keyframes avatar-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.88)}}
@media(prefers-reduced-motion:reduce){.avatar-pulsing{animation:none}}
/* 生成中计时标签 */
.elapsed-timer{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:400;margin-left:4px}
/* 完成后的耗时标签: 更弱化, 不再竞争注意力 */
.elapsed-timer.elapsed-done{color:var(--faint);opacity:.85}
.tok-rate{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:400;margin-left:4px}
.tok-down{font-size:10px;color:var(--accent);font-variant-numeric:tabular-nums;font-weight:400;margin-left:4px}
/* 思考行(dsh ReasoningRow): 图标+标题+分隔点+流式摘要, 扫光动画 */
.think-root{display:flex;flex-direction:column;margin:2px 0 6px}
.think-root:not([data-expanded]){contain:size layout;height:24px;overflow:hidden}
.think-row{position:relative;overflow:hidden;display:flex;align-items:center;height:24px;min-width:0;background:0 0;border:0;padding:0;cursor:pointer;text-align:left;width:100%}
.think-leading{position:relative;flex:none;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;margin-right:6px;color:var(--faint)}
.think-leading svg.icon{width:14px;height:14px}
.think-chevron{position:absolute;inset:0;margin:auto;display:none;color:var(--muted);transition:transform .18s}
.think-root[data-expanded] .think-chevron{transform:rotate(90deg)}
.think-row:hover .think-leading>svg.icon{opacity:0}
.think-row:hover .think-chevron{display:inline-flex}
.think-title{flex:none;font-size:12.5px;color:var(--muted);line-height:24px}
.think-separator{flex:none;background:var(--faint);border-radius:1px;width:2px;height:2px;margin:0 8px}
/* 展开时标题行的摘要与分隔点让位于正文 */
.think-root[data-expanded] .think-summary,.think-root[data-expanded] .think-separator{display:none}
.think-summary{min-width:0;flex:auto;font-size:12.5px;color:var(--faint);line-height:24px;white-space:nowrap;overflow:hidden}
.think-summary[data-follow-end]{display:flex;justify-content:flex-end}
.think-summary[data-follow-end] .think-summary-text{text-align:start;text-overflow:clip;flex:none;width:max-content;min-width:100%;overflow:visible;display:block} /* start: 未满时从左生长, 溢出后 flex-end 钉住右缘向左滚动 */
.think-body{padding:4px 0 4px 22px;color:var(--muted);font-size:12.5px;line-height:20px;white-space:pre-wrap;word-break:break-word}
.think-root[data-state=running] .think-row:after{content:"";position:absolute;left:0;top:0;bottom:0;width:300px;background:linear-gradient(90deg,transparent 0%,color-mix(in srgb,var(--bg) 60%,transparent) 55%,transparent 100%);pointer-events:none;animation:think-sweep 2.6s ease-out infinite}
@keyframes think-sweep{0%{left:-300px}90%,to{left:100%}}
@media(prefers-reduced-motion:reduce){.think-root[data-state=running] .think-row:after{animation:none}}
/* 跳到最新按钮: 锚定聊天框, 浮动在输入框正上方 */
.chat-page{position:relative}
.jump-latest{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 10px);width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.08);z-index:5;transition:background .12s,color .12s}
.jump-latest:hover{background:var(--inset);color:var(--ink)}
/* 项目目录选择(model-menu 风格) */
.dir-row{display:flex;gap:8px;align-items:center}
.dir-row input{flex:1}
.dir-list{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px #2228381a;padding:6px;display:flex;flex-direction:column;gap:2px}
.dir-list-head{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 10px}
.dir-list-path{flex:1;min-width:0;font-size:11px;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.dir-list-head .text-button{flex:none}
.dir-list-body{display:flex;flex-direction:column;max-height:200px;overflow-y:auto}
.dir-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:11px;color:var(--ink);background:transparent;text-align:left;white-space:nowrap;overflow:hidden;cursor:pointer}
.dir-item svg{flex:none;color:var(--accent)}
.dir-item:hover{background:var(--inset)}
.dir-pick-btn{margin-top:6px;align-self:stretch;justify-content:center}
.dir-empty{padding:10px;font-size:11px;color:var(--faint);text-align:center}
.jump-latest[hidden]{display:none}
/* 服务器状态栏: 输入框下方两行 10px 硬件/网速信息(缩进与 composer 的 + 按钮左对齐) */
.sys-stats{display:flex;flex-direction:column;gap:3px;margin-top:5px;padding-left:17px;padding-right:17px;font-size:10px;line-height:10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.sys-line{display:flex;align-items:center;gap:16px;min-height:10px}
.sys-seg{display:inline-flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
.sys-os{flex-shrink:0;font-weight:550;color:var(--ink)}
.sys-gpu-model{flex-shrink:0;font-weight:550;color:var(--ink)}
.sys-bar{display:inline-block;width:42px;height:4px;border-radius:2px;background:var(--inset);box-shadow:inset 0 0 0 1px #d9dde5aa;overflow:hidden;vertical-align:middle}
.sys-bar>span{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.sys-bar.warn>span,.sys-gpu .sys-bar.warn>span,.sys-gpu .sys-bar.mem.warn>span,.sys-gpu .sys-bar.util.warn>span{background:var(--red)}
.sys-gpus{gap:14px}
.sys-gpu{display:inline-flex;align-items:center;gap:3px;flex:1 1 0;min-width:0;cursor:default}
.sys-gpu b{font-size:9px;font-weight:600;color:var(--faint);width:7px;text-align:center;flex-shrink:0}
.sys-gpu .sys-bar{width:auto;flex:1 1 0}
.sys-gpu .sys-bar.mem>span{background:var(--green)}
.sys-gpu .sys-bar.util>span{background:var(--accent)}
/* 消息内错误提示块(复用 think-root 结构), 红色告警, 可展开看详情 */
.error-root .think-leading>svg.icon{color:var(--red)}
.error-root .think-title{color:var(--red);font-weight:600}
.error-root .think-summary,.error-root .think-summary-text{color:var(--red)}
.error-body{padding:0 0 6px}
.error-detail{margin:0;padding:10px 12px;background:var(--red-bg);color:var(--red);border-radius:9px;font-size:11px;font-family:var(--mono)}
/* 消息内工具调用块(复用 think-root 头部样式) */
.tool-list{margin:0 0 4px;padding:4px 12px 8px;display:flex;flex-direction:column;gap:6px}
.tool-item{border-left:2px solid var(--line);padding-left:10px}
.tool-item.tool-running{border-left-color:var(--accent)}
.tool-head{display:flex;align-items:baseline;gap:8px;font-size:12px;min-width:0}
.tool-head code{color:var(--ink-strong);font-size:11.5px;font-weight:600}
.tool-args{color:var(--faint);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
.tool-status{font-size:11px;color:var(--accent)}
.tool-result{margin:4px 0 0;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:11.5px;line-height:17px;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:220px;overflow-y:auto;font-family:var(--mono)}/* 上下文用量圆环与详情浮层(composer 模型按钮左侧) */
.ctx-use{position:relative;display:inline-flex;align-items:center}
.ctx-ring-btn{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:0;box-shadow:var(--shadow-small);border-radius:9px;padding:8px 10px;min-height:32px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctx-ring-btn:hover{background:var(--surface-hover)}
.ctx-ring-svg{display:block;flex-shrink:0}
.ctx-ring-svg .ctx-track{fill:none;stroke:var(--line);stroke-width:3.5}
.ctx-ring-svg .ctx-fill{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;transition:stroke-dashoffset .35s ease,stroke .35s ease}
.ctx-ring-btn[data-level="warn"] .ctx-fill{stroke:var(--amber)}
.ctx-ring-btn[data-level="danger"] .ctx-fill{stroke:var(--red)}
.ctx-ring-btn[data-level="warn"] .ctx-pct{color:var(--amber)}
.ctx-ring-btn[data-level="danger"] .ctx-pct{color:var(--red)}
.ctx-pct{font-size:10px;color:var(--faint);letter-spacing:.1px}
.ctx-pop{position:absolute;bottom:calc(100% + 8px);right:0;min-width:240px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px #2228381a;padding:13px 14px 9px;z-index:60}
.ctx-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:12px;color:var(--muted);margin-bottom:9px}
.ctx-head b{color:var(--ink);font-weight:600}
.ctx-head-cap{color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctx-bar{height:6px;border-radius:3.5px;background:var(--inset);display:flex;overflow:hidden;margin-bottom:9px}
.ctx-seg{height:100%;transition:width .35s ease}
.ctx-seg+.ctx-seg{margin-left:1px}
.ctx-seg.sys,.ctx-dot.sys{background:var(--blue)}
.ctx-seg.tools,.ctx-dot.tools{background:var(--accent)}
.ctx-seg.msgs,.ctx-dot.msgs{background:var(--amber)}
.ctx-rows{display:flex;flex-direction:column;gap:1px}
.ctx-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);padding:4px 0}
.ctx-dot{width:8px;height:8px;border-radius:2.5px;flex-shrink:0}
.ctx-label{flex:1}
.ctx-val{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500}

/* 窄屏: composer 工具行换行, 圆环只保留图标避免挤压模型按钮 */
@media(max-width:600px){
  .composer-toolbar{flex-wrap:wrap}
  .composer-tools{order:2;width:100%}
  .ctx-ring-btn{padding:7px;gap:0}
  .ctx-pct{display:none}
  .ctx-pop{right:auto;left:0}
}
/* Agent 工具设置: 每条工具一行, 标签与标题左对齐, 右侧启用开关; 参数为带高亮的多行编辑框 */
.tool-setting-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.tool-setting-row:last-child{border-bottom:none}
.tool-setting-main{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.tool-setting-side{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;padding-top:2px}
.tool-field{display:grid;grid-template-columns:max-content 1fr;gap:8px;align-items:center}
.tool-field-top{align-items:start}
.tool-field-label{font-size:11px;color:var(--muted);text-align:left}
.tool-field-top .tool-field-label{padding-top:9px}
.tool-name-input,.tool-desc-input,.skill-name-input,.skill-desc-input,.mcp-name-input,.mcp-url-input{width:100%;padding:7px 10px;font-size:12px}
/* 参数编辑框: 高亮 pre 与透明 textarea 同宽软换行, 内容自增高, 由外层容器统一滚动 */
.schema-editor{position:relative;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--inset)}
.schema-editor .schema-highlight{position:absolute;top:0;left:0;right:0;margin:0;padding:8px 10px;font-family:var(--mono);font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-all;overflow:hidden;pointer-events:none;color:var(--muted)}
.schema-editor .tool-schema-input{position:relative;display:block;width:100%;background:transparent;border:0;color:transparent;caret-color:var(--ink);resize:none;overflow:hidden;font-family:var(--mono);font-size:11px;line-height:1.6;padding:8px 10px;white-space:pre-wrap;word-break:break-all}
.j-key{color:var(--accent)}
.j-str{color:var(--green)}
.j-num{color:var(--blue)}
.j-kw{color:var(--red)}
/* 系统提示词设置: 开关行复用工具卡布局, 内容为多行等宽编辑框 */
.sysprompt-textarea{width:100%;min-height:220px;resize:vertical;font-size:11px;line-height:1.7;padding:10px 12px;white-space:pre-wrap}
.sysprompt-builtin{margin-top:12px}
.sysprompt-builtin summary{cursor:pointer;user-select:none}
.sysprompt-builtin-pre{max-height:280px;overflow:auto;padding:10px 12px;font-size:11px;line-height:1.7;white-space:pre-wrap;word-break:break-word;background:var(--inset);border:1px solid var(--line-soft);border-radius:10px;color:var(--muted)}
/* Agent 工具设置: 按来源归组, 组全宽堆叠; 组内工具一行两列网格; 组标题可点击折叠 */
.tool-groups{display:flex;flex-direction:column;gap:18px;margin-bottom:14px}
.tool-group{min-width:0}
.tool-group-header{display:flex;align-items:center;gap:10px;padding:6px 2px 8px;border-bottom:1px solid var(--line-soft);margin-bottom:10px}
.tool-group-toggle{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;background:none;border:none;padding:0;cursor:pointer;text-align:left;font:inherit}
.tool-group-toggle:hover .tool-group-title{color:var(--accent)}
.tool-group-switch{flex:0 0 auto}
.tool-group-title{font-size:12px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:7px}
.tool-group-title::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--accent);opacity:.75}
.tool-group:nth-child(1) .tool-group-title::before{background:var(--blue)}
.tool-group-chevron{transition:transform .18s ease;color:var(--muted)}
.tool-group-toggle[aria-expanded="false"] .tool-group-chevron{transform:rotate(-90deg)}
.tool-group-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.tool-group-rows.collapsed{display:none}
/* ===== 会话锚点轨(参考 Codex/dsh-conversation-anchors: 左侧短横线导航) ===== */
#anchor-rail{position:fixed;left:6px;top:0;bottom:0;width:44px;z-index:30;display:none;flex-direction:column;justify-content:center;pointer-events:none}
#anchor-rail.show{display:flex}
#anchor-rail .anchor-rail-scroll{position:relative;max-height:70vh;overflow-y:auto;overflow-x:visible;scrollbar-width:none;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:6px 0;pointer-events:auto}
#anchor-rail .anchor-rail-scroll::-webkit-scrollbar{display:none}
.anchor-step{display:none;align-self:center;align-items:center;justify-content:center;height:22px;width:22px;margin:2px 0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;pointer-events:auto}
.anchor-step .icon{width:14px;height:14px}
.anchor-step-up .icon{transform:rotate(180deg)}
#anchor-rail[data-overflow]:hover .anchor-step,#anchor-rail[data-overflow]:focus-within .anchor-step{display:inline-flex}
.anchor-step:not([aria-disabled]):hover{background:rgba(128,128,128,.22);color:var(--ink-strong)}
.anchor-tick-row{display:flex;flex:none;align-items:center;justify-content:flex-start;width:100%;height:11px;padding:0 0 0 20px;border:0;background:transparent;cursor:pointer;outline-offset:2px}
.anchor-tick{display:block;width:8px;height:2.5px;border-radius:1px;background:#c6c9d4;transform-origin:left center;transition:width .14s ease,height .14s ease,background-color .14s ease}
.anchor-tick-row:hover .anchor-tick{background:var(--ink)}
.anchor-tick-row[data-active] .anchor-tick{background:var(--ink)}
#anchor-rail[data-waving] .anchor-tick-row[data-active] .anchor-tick{width:8px;height:2.5px;background:#c6c9d4}
#anchor-rail[data-waving] .anchor-tick-row[data-wave="0"] .anchor-tick{width:32px;height:3px;background:var(--ink)}
#anchor-rail[data-waving] .anchor-tick-row[data-wave="1"] .anchor-tick{width:24px;height:2.75px;background:#a2a6b4}
#anchor-rail[data-waving] .anchor-tick-row[data-wave="2"] .anchor-tick{width:17px;height:2.5px;background:#a2a6b4;opacity:.9}
#anchor-rail[data-waving] .anchor-tick-row[data-wave="3"] .anchor-tick{width:12px;background:#b4b7c2}
#anchor-rail[data-waving] .anchor-tick-row[data-wave="4"] .anchor-tick{width:8px;background:#b4b7c2}
#anchor-rail[data-waving] .anchor-tick-row[data-wave="5"] .anchor-tick{width:6px;background:#c6c9d4;opacity:.8}
#anchor-tip{position:fixed;z-index:60;box-sizing:border-box;width:min(280px,calc(100vw - 24px));padding:10px 12px;border-radius:10px;background:var(--ink);color:#fff;font-size:11px;line-height:1.7;box-shadow:0 8px 28px #20273540;pointer-events:none}
#anchor-tip[hidden]{display:none}
#anchor-tip .anchor-tip-title{font-weight:600;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
#anchor-tip .anchor-tip-body{margin-top:4px;opacity:.75;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.user-message[data-flash]{animation:anchorFlash 1.1s ease-out}
@keyframes anchorFlash{0%{background:transparent}30%{background:#e4e2f3}100%{background:transparent}}
.msg-block,.conversation>.user-message{scroll-margin-top:14px}
@media(max-width:1100px){#anchor-rail,#anchor-tip{display:none!important}}
html[data-motion="reduced"] #anchor-tip{display:none}
/* ===== 设置页 Token 用量卡(仿 csusage 页, 去 Agent 明细) ===== */
.usage-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.usage-stat{background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;cursor:default}
.usage-stat-value{font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--ink-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usage-stat-label{margin-top:3px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usage-chart{margin-top:10px;background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:10px 12px 8px}
.usage-chart svg{display:block;width:100%;height:150px}
.usage-chart-note{margin-top:6px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-label{background:transparent;border:0;color:var(--muted);font-size:12px;font-weight:500;padding:3px 10px;border-radius:8px;cursor:pointer}
.tab-label:hover{color:var(--ink);background:var(--inset)}
.tab-label.usage-gran-active{color:var(--ink-strong);background:var(--accent);color:#fff}
.settings-section .table-wrap{max-height:420px;overflow-y:auto}
.settings-section table td,.settings-section table th{white-space:nowrap}
.settings-section table .num{text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:860px){.usage-stats{grid-template-columns:repeat(2,1fr)}}
/* ===== GitHub 风格 Token 活动热力图(每日) ===== */
.usage-heatmap{margin-top:10px;background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:hidden}
.heatmap-wrap{display:inline-flex;flex-direction:column;gap:5px;min-width:100%}
.heatmap-months{display:grid;grid-auto-flow:column;grid-auto-columns:14px;font-size:9px;color:var(--muted);margin-left:19px;font-weight:500}
.heatmap-main{display:flex;gap:3px}
.heatmap-day-labels{display:grid;grid-template-rows:repeat(7,12px);gap:2px;font-size:9px;color:var(--faint);flex:none;width:16px;text-align:right;line-height:12px}
.heatmap-cells{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:12px;gap:2px}
.heatmap-cell{width:12px;height:12px;border-radius:2.5px;background:var(--surface);border:1px solid rgba(0,0,0,.04)}
.heatmap-cell[data-level="1"]{background:var(--accent);opacity:.28;border-color:transparent}
.heatmap-cell[data-level="2"]{background:var(--accent);opacity:.5;border-color:transparent}
.heatmap-cell[data-level="3"]{background:var(--accent);opacity:.75;border-color:transparent}
.heatmap-cell[data-level="4"]{background:var(--accent);opacity:1;border-color:transparent}
.heatmap-legend{display:flex;align-items:center;gap:4px;margin-left:25px}
.heatmap-legend .heatmap-cell{width:11px;height:11px;cursor:default}
.heatmap-legend-total{margin-left:auto}

</style>
</head>

  <div id="app"></div>
  <div id="modal-root"></div>

    const git = st.git || {};
    const row = (entry, depth) => {

      const open = isDir && st.expanded.has(entry.path);

  <script>
/* js/app.js */
/* Application controller: routing, accessible dialogs and real UI interactions. */
(() => {
  'use strict';
  const e = CS.escape, i = CS.icon, H = CS.viewHelpers;
  const allowedRoutes = Object.keys(CS.views).filter(x => !['sidebar','topbar','composer','inspector','scatterPanel','reportDocument','sequenceTool'].includes(x));
  let uploadContext = 'data', modalReturnFocus = null;
  const parseHash = () => {
    const value = location.hash.replace(/^#\/?/, '').split('?')[0];
    const [seg, id] = value.split('/');
    if (seg === 'chat' && id) return { route: 'chat', id };
    return { route: allowedRoutes.includes(value) ? value : 'home', id: null };
  };
  const readRoute = () => parseHash().route;
  const applyRoute = () => {
    const { route, id } = parseHash();
    if (route === 'chat' && id && CS.state.currentRunId !== id) {
      CS.state.currentRunId = id;

      const p = CS.points.find(p => p.id === modal.id); const g = CS.data.groups[p.group];

      body = `<div class="row mb-20">${H.tile('cells')}<div><h3>${e(p.id)}</h3><span class="small muted">${e(g.name)} · 合成数据点</span></div></div><div class="info-pairs"><span>分组</span><span>${e(g.name)}</span><span>显示坐标 X</span><span>${p.x.toFixed(2)}</span><span>显示坐标 Y</span><span>${p.y.toFixed(2)}</span><span>数据来源</span><span>synthetic-ui-fixture</span></div><div class="mt-20">${H.notice('坐标是用于界面展示的二维随机点，不是实际降维计算结果。')}</div>`;

  };

  const previewDataset = async id => {
    const dataset = CS.state.datasets.find(d => d.id === id); if (!dataset) return;
    CS.showModal('preview', { dataset, loading: true });
    let text, message;
    try {
      if (dataset.source === 'demo') {
        if (dataset.format === 'CSV') text = dataset.id === 'ds-plant' ? 'gene,control_1,control_2,control_3,condition_1,condition_2,condition_3\nDEMO_GENE_1,21,34,29,53,49,57\nDEMO_GENE_2,78,81,75,68,64,70\nDEMO_GENE_3,15,18,20,19,21,17\n' : CS.data.sampleCSV;
        else if (dataset.format === 'FASTA') text = CS.data.sampleFASTA;
        else message = '这是元信息示例，不包含真实二进制文件。查看分析结果可体验预设的合成图表。';
      } else if (!CS.files.has(id)) message = '页面刷新后，原始文件对象已释放。请重新导入相同文件以恢复预览；当前只保留元信息。';
      else if (/^(CSV|TSV|TXT|JSON|FASTA|FA|FASTQ|FQ)$/.test(dataset.format)) text = await CS.files.get(id).slice(0,65536).text();
      else message = '此格式仅登记元信息。为保护浏览器内存，本地演示不读取大型或二进制矩阵。';
      // An asynchronous file read must not reopen a dialog that the user already closed.
      if (CS.ui.modal?.type !== 'preview' || CS.ui.modal.dataset.id !== id) return;
      const result = { ...CS.ui.modal, loading: false, message };
      if (text !== undefined && ['CSV','TSV'].includes(dataset.format)) result.table = CS.parseCSV(text,dataset.format === 'TSV' ? '\t' : ',',101).rows;
      else if (text !== undefined) result.text = text;
      CS.ui.modal = result; CS.renderModal();
    } catch(error) { CS.toast('读取文件失败：'+error.message,'error'); CS.closeModal(); }
  };

  const handleFiles = async files => {
    const accepted = [];
    for (const file of [...files]) {
      const format = file.name.split('.').pop().toUpperCase();
      if (!['CSV','TSV','TXT','JSON','FASTA','FA','FASTQ','FQ','H5AD','H5','MTX','GZ'].includes(format)) { CS.toast(`不支持 ${file.name} 的文件格式。`,'error'); continue; }
      if (file.size > 2 * 1024 ** 3) { CS.toast('单文件超过 2 GB，请通过后端或专用客户端处理。','error'); continue; }
      if (file.size === 0) { CS.toast(`${file.name} 是空文件。`,'error'); continue; }
      if (CS.state.datasets.length >= 500) { CS.toast('本地工作空间最多保留 500 份文件记录。','error'); break; }
      let record = CS.state.datasets.find(d => d.source === 'local' && d.name === file.name && d.size === file.size && d.lastModified === file.lastModified);
      if (!record) {
        record = { id: CS.uid('ds'), name: file.name, format, size: file.size, source: 'local', projectId: CS.state.projectId, added: CS.today(), lastModified: file.lastModified, description: '本地导入文件；未上传，不执行文件内容。' };
        CS.state.datasets.push(record);
      }
      CS.files.set(record.id,file); accepted.push(record);
      if (uploadContext === 'attachment' && !CS.ui.attachments.includes(record.id)) CS.ui.attachments.push(record.id);
    }
    CS.save(); CS.render();
    if (accepted.length) {
      if (uploadContext === 'preview') await previewDataset(accepted[0].id);
      else if (CS.ui.modal?.type === 'import') { CS.ui.modal.imported = [...(CS.ui.modal.imported || []), ...accepted]; CS.renderModal(); }
      CS.toast(`已在本地登记 ${accepted.length} 份文件，未上传。`);
    }
  };
  const chooseFiles = context => { uploadContext = context; const input = document.getElementById('file-input'); input.value = ''; input.click(); };
  const emitRender = () => { CS.save(); CS.render(); };
  const exportMetadata = () => {
    const rows = CS.state.datasets.filter(d => CS.ui.datasetSelection.has(d.id));
    if (!rows.length) return;
    const columns = ['name','format','size','source','added','projectId'];
    const text = [columns.join(','),...rows.map(d => columns.map(col => CS.csvCell(d[col])).join(','))].join('\r\n');
    CS.download('dataset_metadata.csv','\uFEFF'+text,'text/csv;charset=utf-8'); CS.toast('已导出所选文件元信息。');
  };
  const _loadDirListing = async path => {
    const box = document.getElementById('dir-listing');
    if (!box) return;
    box.innerHTML = '<p class="small muted">读取目录…</p>';
    try {
      const d = await CS.api.request('/fs/dirs?path=' + encodeURIComponent(path));
      CS.ui.projectsRoot = CS.ui.projectsRoot || d.root;
      box.dataset.parent = d.parent || '';
      box.dataset.path = d.path;
      box.innerHTML = `<div class="dir-list"><div class="dir-list-head"><span class="dir-list-path" title="${e(d.path)}">${'\u2066'}${e(d.path)}${'\u2069'}</span>`
        + (d.parent ? `<button type="button" class="text-button muted small" data-action="dir-parent">上一级</button>` : '')
        + `<button type="button" class="text-button muted small" data-action="dir-cancel">收起</button></div>`
        + `<div class="menu-divider"></div>`
        + (d.error ? `<div class="dir-empty">${e(d.error)}</div>` : '')
        + (d.dirs.length ? `<div class="dir-list-body">${d.dirs.map(x => `<button type="button" class="dir-item" data-action="dir-navigate" data-id="${e(x.path)}">${i('folder','',14)}<span>${e(x.name)}</span></button>`).join('')}</div>` : (d.error ? '' : '<div class="dir-empty">此目录下没有子文件夹</div>'))
        + `<div class="menu-divider"></div><button type="button" class="btn small-btn dir-pick-btn" data-action="dir-pick" data-id="${e(d.path)}">选择此文件夹作为项目目录</button></div>`;
    } catch (err) {
      box.innerHTML = '<p class="small">读取目录失败：' + e(CS.api.friendlyError(err)) + '</p>';
    }
  };
  // 展开/收起思考或工具块: 全量重渲染后把被点击的行锚回原视口位置,
  // 否则上方同类块同时展开增高(展开态是全局的)会把点击行挤出视野。
  const _toggleAnchored = (row, mutate) => {
    const block = row?.closest('.msg-block');
    const idx = block ? [...block.parentElement.children].indexOf(block) : -1;
    const rowTop = row?.getBoundingClientRect().top;
    mutate();
    CS.render();
    if (!row || idx < 0) return;
    const freshConv = document.querySelector('.conversation');
    const freshBlock = freshConv?.children[idx];
    // 同一动作可能出现多行(每条消息可有多个思考/工具块), 用 data-id 精确定位被点击的那行,
    // 否则滚动补偿会以错误的行为基准, 表现为页面位置乱跳
    const sel = '[data-action="' + row.dataset.action + '"]' + (row.dataset.id != null ? '[data-id="' + CSS.escape(row.dataset.id) + '"]' : '');
    const freshRow = freshBlock ? freshBlock.querySelector(sel) : null;
    if (freshRow && freshConv) freshConv.scrollTop += freshRow.getBoundingClientRect().top - rowTop;
  };
  const actions = {
    'toggle-sidebar': () => { CS.ui.mobileSidebar = !CS.ui.mobileSidebar; CS.render(); },
    'toggle-user-menu': () => { CS.ui.userMenu = !CS.ui.userMenu; CS.render(); },
    'toggle-model-menu': () => { CS.ui.modelMenu = !CS.ui.modelMenu; CS.render(); },
    'toggle-context-menu': () => { CS.ui.contextMenu = !CS.ui.contextMenu; CS.ui.modelMenu = false; CS.render(); },
    'pick-model': async id => {
      const model = CS.ui.models.find(x => x.id === id);
      if (!model) { CS.ui.modelMenu = false; CS.render(); return; }
      CS.state.settings.modelId = model.id; CS.state.settings.model = model.model;
      CS.ui.modelMenu = false; emitRender();
      try { await CS.api.modelCall('model.save', 'POST', '/models', { id: model.id, providerId: model.providerId, model: model.model, isDefault: true, contextWindow: model.contextWindow || null }); CS.agent.loadModels(); }
      catch (error) { CS.toast('切换默认模型失败：' + CS.api.friendlyError(error), 'error'); }
    },
    'toggle-project-menu': () => { CS.ui.projectMenu = !CS.ui.projectMenu; CS.render(); },
    'clear-project': () => { CS.state.projectId = null; CS.ui.projectMenu = false; CS.save(); CS.render(); },
    'pick-project': id => { CS.state.projectId = id; CS.ui.projectMenu = false; CS.save(); CS.render(); },
    'toggle-project': id => { CS.ui.expandedProjects.has(id) ? CS.ui.expandedProjects.delete(id) : CS.ui.expandedProjects.add(id); CS.persistFold(); CS.render(); },
    'toggle-projects-section': () => { CS.ui.projectsCollapsed = !CS.ui.projectsCollapsed; CS.persistFoldSection(); CS.render(); },
    'toggle-unassigned': () => { CS.ui.unassignedCollapsed = !CS.ui.unassignedCollapsed; CS.persistFoldLoose(); CS.render(); },
    'toggle-fs-section': () => { CS.ui.fsCollapsed = !CS.ui.fsCollapsed; CS.persistFoldFs(); CS.render(); },
    'fs-dir': (id, el) => {
      const path = el?.dataset?.path || id;
      const st = CS.ui.fs; if (!path || !st) return;
      if (st.expanded.has(path)) st.expanded.delete(path);
      else { st.expanded.add(path); if (!Array.isArray(st.children[path])) CS.agent.loadFsDir(path); }
      CS.render();
    },
    'fs-open': (id, el) => { const path = el?.dataset?.path || id; if (path) CS.agent.previewFsFile(path); },
    'fs-refresh': () => {
      const st = CS.ui.fs; if (!st) return;
      st.children = {}; st.git = {}; st.loading = true;
      const keep = [...st.expanded];
      st.expanded = new Set(keep);
      CS.agent.loadFsDir('');
      CS.render();
    },
    'toggle-project-settings': id => { CS.ui.projectSettingsMenu = CS.ui.projectSettingsMenu === id ? null : id; CS.render(); },
    'copy-message': id => {
      const run = CS.currentRun(); const m = run?.messages[Number(id)];
      if (!m) return;
      navigator.clipboard?.writeText(m.content).then(() => CS.toast('已复制到剪贴板。')).catch(() => CS.toast('复制失败。', 'error'));
    },
    'edit-message': id => {
      const run = CS.currentRun(); const idx = Number(id);
      if (!run || !run.messages[idx]) return;
      CS.ui.composer = run.messages[idx].content;
      run.messages.splice(idx);  // 截断该消息及其后的回复，重新编辑发送
      CS.save(); CS.render();
      document.querySelector('.composer-input, textarea')?.focus();
    },
    'branch-chat': id => {
      const run = CS.currentRun(); const idx = Number(id);
      if (!run) return;
      const branch = {
        ...run, id: CS.uid('run'), kind: 'chat',
        title: (run.title.slice(0, 20) + ' ·分支'), messages: JSON.parse(JSON.stringify(run.messages.slice(0, idx + 1))),
        createdAt: new Date().toISOString(),
      };
      CS.state.runs.push(branch); CS.state.currentRunId = branch.id; CS.save();
      CS.agent.registerConversation(branch);
      CS.render(); CS.toast('已从该消息创建分支聊天。');
    },
    'toggle-pin-conversation': id => {
      const conv = CS.ui.conversations.find(c => c.id === id); if (!conv) return;
      conv.pinned = !conv.pinned;
      CS.emit('render');
      CS.api.modelCall('conversation.save', 'POST', '/conversations', { id: conv.id, title: conv.title, projectId: conv.projectId, pinned: conv.pinned, archived: !!conv.archived }).catch(() => {});
    },
    'archive-conversation': id => {
      const conv = CS.ui.conversations.find(c => c.id === id); if (!conv) return;
      conv.archived = true;
      CS.emit('render');
      CS.api.modelCall('conversation.save', 'POST', '/conversations', { id: conv.id, title: conv.title, projectId: conv.projectId, pinned: !!conv.pinned, archived: true }).then(() => CS.agent.loadConversations()).catch(() => {});
    },
    'delete-project': id => {
      const project = CS.state.projects.find(p => p.id === id); if (!project) return;
      CS.ui.projectSettingsMenu = null;
      CS.showModal('confirm',{title:'删除项目？',message:'将删除项目「' + project.name + '」。其下会话不会删除，转为未归属项目的会话。此操作不可撤销。',confirmAction:'confirm-delete-project',confirmLabel:'删除',danger:true,projectId:id});
    },
    'confirm-delete-project': async () => {
      const id = CS.ui.modal?.projectId; if (!id) return;

  CS.fetchModelMetaSoon = immediate => {
    clearTimeout(CS.ui._metaTimer);
    const run = async () => {
      const name = CS.ui.draftModelName?.trim() || '';
      const box = document.getElementById('model-meta-hint');
      if (!box) return;
      if (!name) { box.textContent = ''; CS.ui.modelMeta = null; return; }
      box.textContent = '正在查询 LiteLLM 模型库…';
      try {
        const meta = await CS.api.request('/model-meta?model=' + encodeURIComponent(name));
        CS.ui.modelMeta = meta;
        if (!document.getElementById('model-meta-hint')) return;
        box.innerHTML = meta.matched ? [
          meta.priceInUsdPerM != null ? `输入 $${meta.priceInUsdPerM}/M` : '输入价未公布',
          meta.priceOutUsdPerM != null ? `输出 $${meta.priceOutUsdPerM}/M` : '输出价未公布',
          meta.contextWindow ? `上下文 ${CS.usageNum(meta.contextWindow)}` : '',
          meta.maxOutputTokens ? `最大输出 ${CS.usageNum(meta.maxOutputTokens)}` : '',
          `目录键 ${meta.litellmKey}`,
        ].filter(Boolean).join(' · ') + '（自动读取，可手动覆盖）' : 'LiteLLM 模型库未收录此模型，上下文按默认 131072，建议手动填写。';
      } catch { box.textContent = ''; }
    };
    CS.ui._metaTimer = setTimeout(run, immediate ? 0 : 500);

    const match = location.pathname.match(/^(\/[a-zA-Z0-9_-]+)\/science\/?$/);
    const candidates = [];
    if (CS.state.settings.endpoint) candidates.push(CS.state.settings.endpoint);
    if (match) candidates.push(match[1] + '/api');
    if (!candidates.includes('/api')) candidates.push('/api');
    for (const base of [...new Set(candidates)]) {
      if (await probe(base)) {
        if (CS.state.settings.endpoint !== base) {
          CS.state.settings.endpoint = base; CS.save(); CS.render();
          // 地址已变：重置 WS 状态，让后续连接用新地址
          CS.api.ws.failedAt = 0;
          const stale = CS.api.ws.socket; CS.api.ws.socket = null; CS.api.ws.state = 'closed';
          if (stale) { try { stale.close(); } catch {} }
          CS.toast('服务接口地址已自动设为 ' + base);
        }
        return;
      }
    }
  };
  CS.agent.loadProjects = async () => {
    try {
      let data = await CS.api.modelCall('project.list', 'GET', '/projects');
      if (!data.projects?.length && CS.state.projects.length) {
        for (const p of CS.state.projects.filter(x => !x.archived)) {
          await CS.api.modelCall('project.save', 'POST', '/projects', { id: p.id, name: p.name, description: p.description || '', tags: p.tags || [], icon: p.icon || 'folder', remote: p.remote || null }).catch(() => {});
        }
        data = await CS.api.modelCall('project.list', 'GET', '/projects');
      }
      CS.state.projects = (data.projects || []).map(p => ({ ...p, created: p.createdAt ? new Date(p.createdAt).toISOString().slice(0, 10) : CS.today(), updated: p.updatedAt ? new Date(p.updatedAt).toISOString().slice(0, 10) : CS.today(), archived: false }));
      if (CS.state.projects.length && !CS.state.projects.some(p => p.id === CS.state.projectId)) CS.state.projectId = CS.state.projects[0].id;
      CS.save(); CS.emit('render');
    } catch (error) { /* 服务器不可用时保持本地项目列表 */ }
  };
  CS.agent.loadConversations = async () => {
    try {
      const data = await CS.api.modelCall('conversation.list', 'GET', '/conversations');
      CS.ui.conversations = Array.isArray(data.conversations) ? data.conversations : [];
      CS.emit('render');
    } catch (error) { /* 忽略：服务器不可用时保留旧列表 */ }
  };
  CS.agent.registerConversation = run => {
    if (!run) return;
    CS.ui.conversations.unshift({ id: run.id, title: run.title, projectId: run.projectId, createdAt: Date.now(), updatedAt: Date.now() });
    const payload = { id: run.id, title: run.title, projectId: run.projectId };
    const real = (run.messages || []).filter(m => m.role === 'user' || m.role === 'assistant' && m.content);
    if (real.length) payload.content = real.map(m => ({ role: m.role, content: m.content }));  // 空则不带 → 服务端保留已有
    CS.api.modelCall('conversation.save', 'POST', '/conversations', payload)
      .then(() => CS.agent.loadConversations()).catch(() => {});
  };
  CS.agent.loadFsDir = async path => {
    const st = CS.ui.fs; if (!st) return;
    try {
      const data = await CS.api.request('/fs/tree?projectId=' + encodeURIComponent(st.projectId) + '&path=' + encodeURIComponent(path || ''), { method: 'GET' });
      const cur = CS.ui.fs; if (!cur || cur.projectId !== st.projectId) return;
      if (path) { cur.children[path] = data.entries || []; cur.expanded.add(path); } else cur.root = data.entries || [];
      cur.git = { ...cur.git, ...(data.git || {}) };
      cur.loading = false;
      CS.emit('render');
    } catch (error) {
      const cur = CS.ui.fs; if (cur && cur.projectId === st.projectId) { cur.loading = false; if (!path && !Array.isArray(cur.root)) { cur.root = []; cur.error = (error && error.message) || ''; } }
      CS.emit('render');
    }
  };
  CS.agent.previewFsFile = async path => {
    const st = CS.ui.fs; if (!st) return;
    try {
      const data = await CS.api.request('/fs/file?projectId=' + encodeURIComponent(st.projectId) + '&path=' + encodeURIComponent(path), { method: 'GET' });
      CS.showModal('fs-preview', { name: path.split('/').pop(), ...data });
    } catch { CS.toast('无法读取该文件。', 'error'); }
  };
  CS.api.detectEndpoint().finally(() => { CS.agent.loadModels(); CS.agent.loadProjects().then(() => CS.agent.loadConversations()); });
  if(CS.storageUnavailable)CS.toast('浏览器存储不可用，当前仅在内存运行。','error');
})();

</script>
